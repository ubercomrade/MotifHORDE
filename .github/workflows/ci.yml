name: Julia

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - run: julia -e 'using Pkg; Pkg.activate("."); Pkg.instantiate()'
      - run: julia -e 'using Pkg; Pkg.activate("."); Pkg.test()'
