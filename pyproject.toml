[project]
name = "motifhorde"
version = "0.3.0"
description = "Motif Harmonized Orchestration for Robust Discovery and Evaluation"
authors = [{name = "Anton Tsukanov", email = "tsukanov@bionet.nsc.ru"}]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.4.6,<3",
    "mimosa-tool>=2.0.0,<2.1"
]

[dependency-groups]
dev = [
    "pytest>=7.1.3",
    "ruff>=0.15.0",
]

[project.scripts]
motifhorde = "motifhorde.cli:main_cli"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
